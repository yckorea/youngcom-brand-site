name: Import blog kit once

on:
  push:
    paths:
      - ".github/workflows/import-blog-kit.yml"

permissions:
  contents: write

jobs:
  import-blog-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original blog kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p story
          base="https://runday.irumai.kr/260829/kit/blog"
          for file in posts.json index.html post.html admin.html; do
            curl --fail --location --retry 3 --retry-delay 2 "$base/$file" --output "story/$file"
          done
          python -m json.tool story/posts.json >/dev/null
      - name: Commit imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story/posts.json story/index.html story/post.html story/admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: import original blog kit"
          git push
