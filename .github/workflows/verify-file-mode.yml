name: Verify local file mode once

on:
  push:
    paths:
      - ".github/workflows/verify-file-mode.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Test file URLs
        shell: bash
        run: |
          cat > /tmp/verify-file.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const { pathToFileURL } = require('node:url');
          const path = require('node:path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const errors = [];
            let current = '';
            page.on('console', msg => { if (msg.type() === 'error') errors.push(current + ' console: ' + msg.text()); });
            page.on('pageerror', err => errors.push(current + ' page: ' + err.message));
            const url = rel => pathToFileURL(path.join(process.cwd(), rel)).href;

            current = 'home';
            await page.goto(url('index.html'), { waitUntil: 'load' });
            await page.locator('[data-product-list] .catalog-card').first().waitFor({ timeout: 15000 });
            await page.locator('[data-home-stories] .story-item').first().waitFor({ timeout: 15000 });
            const productCards = await page.locator('[data-product-list] .catalog-card').count();
            const storyCards = await page.locator('[data-home-stories] .story-item').count();
            if (productCards !== 3 || storyCards !== 2) throw new Error('Home cards mismatch');

            current = 'story';
            await page.goto(url('story/index.html'), { waitUntil: 'load' });
            await page.locator('.blog-card').first().waitFor({ timeout: 15000 });
            if (await page.locator('.site-header').count() !== 1 || await page.locator('footer').count() !== 1) throw new Error('Story chrome missing');

            current = 'post';
            await page.goto(url('story/post.html') + '?id=first-story-20260829', { waitUntil: 'load' });
            await page.locator('.post-article').waitFor({ timeout: 15000 });
            if (await page.locator('.site-header').count() !== 1 || await page.locator('footer').count() !== 1) throw new Error('Post chrome missing');

            current = 'mobile';
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(url('story/index.html'), { waitUntil: 'load' });
            await page.locator('.menu-toggle').click();
            if (await page.locator('.menu-toggle').getAttribute('aria-expanded') !== 'true') throw new Error('Mobile menu failed');
            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ fileMode: true, productCards, storyCards, sharedChrome: true, mobileMenu: true, consoleErrors: 0 }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node /tmp/verify-file.cjs
