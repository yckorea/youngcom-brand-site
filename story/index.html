<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="영컴통신의 현장 경험과 무선 기술 이야기를 기록합니다.">
  <meta name="theme-color" content="#f7f5ef">
  <title>이야기 | 영컴통신</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="story.css">
</head>
<body class="blog-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="../index.html" aria-label="영컴통신 홈"><span class="brand-mark" aria-hidden="true">영</span><span>영컴통신</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="sr-only">메뉴 열기</span><span></span><span></span></button>
      <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
        <a href="../index.html">홈</a><a href="../about.html">내 소개</a><a href="../products.html">제품</a>
        <a class="active" aria-current="page" href="index.html">이야기</a>
        <a class="nav-cta" href="../index.html#contact">연락하기</a>
      </nav>
    </div>
  </header>

  <main class="blog-shell" id="main">
    <div class="blog-tools"><a class="admin-link" href="admin.html">관리</a></div>
    <section class="blog-hero">
      <p class="eyebrow">YOUNGCOM STORY</p>
      <h1>현장에서 쌓아온<br><em>통신 이야기</em></h1>
      <p>무전기와 기술, 그리고 사람에 관한 기록을 천천히 쌓아갑니다.</p>
    </section>
    <ul class="blog-list" id="list" aria-live="polite"><li class="blog-empty">이야기를 불러오는 중입니다.</li></ul>
  </main>

  <footer>
    <a class="brand footer-brand" href="../index.html"><span class="brand-mark">영</span><span>영컴통신</span></a>
    <div class="footer-info"><p>현장의 통신을 책임지고, 판매한 제품은 끝까지 책임집니다.</p><p>© <span id="year"></span> YOUNGCOM COMMUNICATIONS. ALL RIGHTS RESERVED.</p></div>
    <a class="back-top" href="#top" aria-label="맨 위로 이동">↑</a>
  </footer>

  <script>
  (() => {
    const list = document.querySelector('#list');
    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };
    const formatDate = (value) => {
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime())
        ? value || ''
        : `${date.getFullYear()}. ${date.getMonth() + 1}. ${date.getDate()}.`;
    };
    const render = (posts) => {
      const sorted = Array.isArray(posts)
        ? [...posts].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
        : [];
      if (!sorted.length) {
        list.innerHTML = '<li class="blog-empty">아직 등록된 이야기가 없습니다.</li>';
        return;
      }
      const fragment = document.createDocumentFragment();
      sorted.forEach((post) => {
        const item = element('li', 'blog-card');
        const link = element('a');
        link.href = post.url ? String(post.url) : `post.html?id=${encodeURIComponent(post.id || '')}`;
        const time = element('time', null, formatDate(post.date));
        time.dateTime = String(post.date || '');
        link.append(time, element('h2', null, post.title || '(제목 없음)'));
        if (post.summary) link.appendChild(element('p', 'summary', post.summary));
        if (Array.isArray(post.tags) && post.tags.length) {
          const tags = element('div', 'tags');
          post.tags.forEach((tag) => tags.appendChild(element('span', 'tag', tag)));
          link.appendChild(tags);
        }
        item.appendChild(link);
        fragment.appendChild(item);
      });
      list.replaceChildren(fragment);
    };
    fetch('posts.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then(render)
      .catch(() => {
        list.innerHTML = '<li class="blog-error">글 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</li>';
      });
  })();
  </script>
  <script src="../script.js"></script>
</body>
</html>
