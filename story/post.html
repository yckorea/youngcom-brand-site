<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="author" content="">
  <meta name="theme-color" content="#f7f5ef">
  <link rel="canonical" href="">
  <meta property="og:type" content="article">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <title>이야기 | 영컴통신</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="story.css">
</head>
<body class="blog-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="../index.html" aria-label="영컴통신 홈"><span class="brand-mark" aria-hidden="true">영</span><span>영컴통신</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="sr-only">메뉴 열기</span><span></span><span></span></button>
      <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
        <a href="../index.html">홈</a><a href="../about.html">내 소개</a><a href="../products.html">제품</a>
        <a class="active" aria-current="page" href="index.html">이야기</a>
        <a class="nav-cta" href="../index.html#contact">연락하기</a>
      </nav>
    </div>
  </header>

  <div class="post-shell">
    <div class="post-top"><a class="post-back" href="index.html">← 이야기 목록으로</a></div>
    <main id="main" aria-live="polite"></main>
  </div>

  <footer>
    <a class="brand footer-brand" href="../index.html"><span class="brand-mark">영</span><span>영컴통신</span></a>
    <div class="footer-info"><p>현장의 통신을 책임지고, 판매한 제품은 끝까지 책임집니다.</p><p>© <span id="year"></span> YOUNGCOM COMMUNICATIONS. ALL RIGHTS RESERVED.</p></div>
    <a class="back-top" href="#top" aria-label="맨 위로 이동">↑</a>
  </footer>

  <script>
  (() => {
    const main = document.querySelector('#main');
    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };
    const formatDate = (value) => {
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime())
        ? value || ''
        : `${date.getFullYear()}. ${date.getMonth() + 1}. ${date.getDate()}.`;
    };
    const hrefOf = (post) => post.url
      ? String(post.url)
      : `post.html?id=${encodeURIComponent(post.id || '')}`;

    const renderBody = (source) => {
      const box = element('div', 'post-body');
      String(source || '').replace(/\r\n/g, '\n').split(/\n\s*\n/).forEach((raw) => {
        const block = raw.trim();
        if (!block) return;
        const lines = block.split('\n');
        if (lines.every((line) => /^- /.test(line.trim()))) {
          const list = element('ul');
          lines.forEach((line) => list.appendChild(element('li', null, line.trim().slice(2))));
          box.appendChild(list);
        } else if (/^## /.test(block)) {
          box.appendChild(element('h2', null, block.slice(3).trim()));
        } else {
          box.appendChild(element('p', null, block));
        }
      });
      return box;
    };

    const setAttribute = (selector, attribute, value) => {
      const node = document.querySelector(selector);
      if (node) node.setAttribute(attribute, value);
    };
    const addStructuredData = (data) => {
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(data);
      document.head.appendChild(script);
    };
    const setMetadata = (post) => {
      const title = String(post.title || '이야기');
      const description = String(post.description || post.summary || '').slice(0, 160);
      const canonical = new URL(location.href);
      canonical.search = `?id=${encodeURIComponent(post.id || '')}`;
      document.title = `${title} | 영컴통신`;
      setAttribute('meta[name="description"]', 'content', description);
      setAttribute('meta[name="author"]', 'content', String(post.author || ''));
      setAttribute('link[rel="canonical"]', 'href', canonical.href);
      setAttribute('meta[property="og:title"]', 'content', title);
      setAttribute('meta[property="og:description"]', 'content', description);
      setAttribute('meta[property="og:url"]', 'content', canonical.href);
      const article = {
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        headline: title,
        description,
        datePublished: String(post.date || ''),
        dateModified: String(post.updated || post.date || ''),
        mainEntityOfPage: canonical.href,
        keywords: Array.isArray(post.tags) ? post.tags.join(', ') : ''
      };
      if (post.author) article.author = { '@type': 'Person', name: String(post.author) };
      addStructuredData(article);
      const faq = Array.isArray(post.faq) ? post.faq.filter((item) => item && item.q && item.a) : [];
      if (faq.length) {
        addStructuredData({
          '@context': 'https://schema.org',
          '@type': 'FAQPage',
          mainEntity: faq.map((item) => ({
            '@type': 'Question',
            name: String(item.q),
            acceptedAnswer: { '@type': 'Answer', text: String(item.a) }
          }))
        });
      }
    };

    const renderNotFound = () => {
      const box = element('div', 'notfound');
      box.append(element('h1', null, '글을 찾을 수 없습니다'), element('p', null, '주소가 잘못되었거나 삭제된 글일 수 있어요.'));
      const link = element('a', null, '이야기 목록으로 돌아가기');
      link.href = 'index.html';
      box.appendChild(link);
      main.replaceChildren(box);
    };

    const render = (items) => {
      const posts = Array.isArray(items)
        ? [...items].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
        : [];
      const id = new URLSearchParams(location.search).get('id') || new URLSearchParams(location.search).get('slug');
      const index = posts.findIndex((post) => String(post.id) === id || (post.url && String(post.url).replace(/\.html$/, '') === id));
      if (index < 0) return renderNotFound();
      const post = posts[index];
      setMetadata(post);

      const article = element('article', 'post-article');
      const head = element('header', 'post-head');
      const time = element('time', null, formatDate(post.date));
      time.dateTime = String(post.date || '');
      head.append(time, element('h1', null, post.title || '(제목 없음)'));
      if (post.author || (post.updated && post.updated !== post.date)) {
        const meta = element('div', 'meta');
        if (post.author) meta.appendChild(element('span', null, post.author));
        if (post.updated && post.updated !== post.date) meta.appendChild(element('span', null, `수정 ${formatDate(post.updated)}`));
        head.appendChild(meta);
      }
      if (Array.isArray(post.tags) && post.tags.length) {
        const tags = element('div', 'tags');
        post.tags.forEach((tag) => tags.appendChild(element('span', 'tag', tag)));
        head.appendChild(tags);
      }
      article.append(head, element('hr', 'post-rule'), renderBody(post.body));

      const faq = Array.isArray(post.faq) ? post.faq.filter((item) => item && item.q && item.a) : [];
      if (faq.length) {
        const section = element('section', 'post-faq');
        section.appendChild(element('h2', null, '자주 묻는 질문'));
        faq.forEach((item) => {
          const details = element('details');
          details.append(element('summary', null, item.q), element('p', null, item.a));
          section.appendChild(details);
        });
        article.appendChild(section);
      }
      if (Array.isArray(post.sources) && post.sources.length) {
        const section = element('section', 'post-sources');
        section.appendChild(element('h2', null, '참고·출처'));
        const list = element('ol');
        post.sources.forEach((source) => {
          const item = element('li');
          if (source && source.url) {
            const link = element('a', null, source.title || source.url);
            link.href = source.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            item.appendChild(link);
          } else item.textContent = String(source && source.title || source || '');
          list.appendChild(item);
        });
        section.appendChild(list);
        article.appendChild(section);
      }

      const previous = posts[index + 1];
      const next = posts[index - 1];
      if (previous || next) {
        const navigation = element('nav', 'post-pn');
        const addCell = (target, className, label) => {
          if (!target) return navigation.appendChild(element('span'));
          const link = element('a', className);
          link.href = hrefOf(target);
          link.append(element('div', 'dir', label), element('div', 'pn-title', target.title || ''));
          navigation.appendChild(link);
        };
        addCell(previous, 'prev', '이전 글');
        addCell(next, 'next', '다음 글');
        article.appendChild(navigation);
      }
      main.replaceChildren(article);
    };

    const postsUrl = location.protocol === 'file:'
      ? 'https://raw.githubusercontent.com/yckorea/youngcom-brand-site/main/story/posts.json'
      : 'posts.json';
    fetch(postsUrl, { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then(render)
      .catch(renderNotFound);
  })();
  </script>
  <script src="../script.js"></script>
</body>
</html>
